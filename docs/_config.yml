title: human-manual-oco
description: Человеческий мануал / The Human Manual - проверенные факты, короткие цитаты, статус доказательности.
theme: null
markdown: kramdown
plugins:
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
optional_front_matter:
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: true
  collection: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
